services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    container_name: enterprise-web

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile

    container_name: enterprise-admin

    ports:
      - "3001:3001"

    environment:
      NODE_ENV: production
      PORT: 3001
